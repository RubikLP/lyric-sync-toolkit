name: Build and publish Docker image

# Builds the image on every push to main and publishes it to GitHub
# Container Registry (ghcr.io), so Unraid never needs the source code
# locally - it just pulls the finished image, the same way Immich or
# ComfyUI stacks do.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ghcr.io image names must be lowercase - hardcoded rather than
          # derived from the repo owner, which may contain uppercase letters.
          tags: ghcr.io/rubiklp/lyric-sync-toolkit:latest
